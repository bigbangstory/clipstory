<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Clipstory{% endblock %}</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --line:#2a2f3a;
  --text:#e6e9ef; --muted:#9aa3b2; --accent:#4ade80; --accent-dim:#166534;
  --danger:#f87171; --danger-dim:#7f1d1d; --warn:#fbbf24; --radius:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
/* author rules on video/div would otherwise beat the browser's [hidden] default */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
.bar{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:20px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.2px;color:var(--text)}
.brand span{color:var(--accent)}
.bar nav{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:14px}
.bar nav .who{color:var(--muted)}
main{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.3px}
h2{font-size:16px;margin:28px 0 12px;color:var(--text)}
.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.btn{display:inline-block;background:var(--accent);color:#07260f;border:0;border-radius:8px;
  padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08);text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger-dim)}
input[type=text],input[type=email],input[type=file],textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit}
textarea{font-family:var(--mono);font-size:13px;line-height:1.7;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent-dim);border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;padding:3px 9px;border-radius:20px;border:1px solid}
.badge.complete{color:var(--accent);border-color:var(--accent-dim);background:#0d2b18}
.badge.failed{color:var(--danger);border-color:var(--danger-dim);background:#2b1010}
.badge.pending,.badge.uploading,.badge.uploaded,.badge.awaiting_cuts{color:var(--muted);border-color:var(--line);background:var(--panel-2)}
.badge.rendering,.badge.probing,.badge.queued{color:var(--warn);border-color:#78350f;background:#2b2010}
.note{border-left:3px solid var(--line);padding:12px 16px;background:var(--panel-2);
  border-radius:0 8px 8px 0;font-size:14px;color:var(--muted);margin:14px 0}
.note.bad{border-left-color:var(--danger);color:#fecaca;background:#2b1010}
.note.good{border-left-color:var(--accent);color:#bbf7d0;background:#0d2b18}
.note.warn{border-left-color:var(--warn);color:#fde68a;background:#2b2010}
.muted{color:var(--muted)}
.progress{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:var(--accent);transition:width .3s ease;width:0}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.stat{display:flex;gap:26px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.stat b{color:var(--text);font-weight:600}
/* review workspace: clips on the left, player + timeline + transcript on the right */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:22px}
.clips-section .panel{overflow-x:auto}
video{width:100%;border-radius:var(--radius);background:#000;margin-bottom:10px;display:block}
.badge.transcribing,.badge.suggesting,.badge.suggest_requested{color:var(--warn);border-color:#78350f;background:#2b2010}
.badge.finalised{color:var(--accent);border-color:var(--accent-dim);background:#0d2b18}
.badge.expired,.badge.new{color:var(--muted);border-color:var(--line);background:var(--panel-2)}
table.clips td{padding:9px 8px;vertical-align:top}
table.clips th{padding:0 8px 8px}
table.clips .seq{padding-left:16px}
table.clips input.label{padding:5px 8px;font-size:13px;min-width:140px}
table.clips .edge .mono{font-size:12px;display:block}
.nudge{display:flex;gap:3px;margin-top:4px}
.nudge button,.actions button{background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;font-size:11px;cursor:pointer;font-family:var(--mono)}
.nudge button:hover,.actions button:hover{border-color:var(--accent)}
.actions{white-space:nowrap;text-align:right;padding-right:14px}
.actions button{margin-right:4px;font-family:inherit}
.actions button.danger{color:var(--danger);border-color:var(--danger-dim)}
.actions a{font-size:13px;margin-left:4px}
.err{color:var(--danger);font-size:12px;margin-top:3px}
.timeline{position:relative;height:38px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;margin:0 0 6px;cursor:pointer;user-select:none;overflow:hidden}
.tclip{position:absolute;top:5px;bottom:5px;background:var(--accent-dim);border:1px solid var(--accent);
  border-radius:5px;min-width:6px;display:flex;align-items:center;justify-content:center}
.tclip.pending{background:#78350f;border-color:var(--warn)}
.tclip .num{font-size:10px;color:#fff;font-family:var(--mono);pointer-events:none}
.tclip .handle{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.18)}
.tclip .handle.l{left:0;border-radius:5px 0 0 5px}
.tclip .handle.r{right:0;border-radius:0 5px 5px 0}
.tclip .handle:hover{background:rgba(255,255,255,.45)}
.timeline .cursor{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;left:0}
.transcript{max-height:420px;overflow-y:auto;padding-right:6px}
.transcript::-webkit-scrollbar{width:8px}
.transcript::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.tline{margin:0;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px;
  display:flex;gap:10px;align-items:baseline;transition:background .12s}
.tline:hover{background:var(--panel-2)}
.tline.playing{background:#0d2b18}
.tline.range-start{background:#2b2010;outline:1px solid #78350f}
.tline.hit .ttext{background:#78350f;border-radius:3px}
.tline.dim{opacity:.3}
.tstamp{color:var(--muted);font-size:11px;flex:none;padding-top:2px}
details.panel summary{font-size:14px}
/* text-based editing */
.modes{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.modes a{padding:6px 16px;border-radius:6px;font-size:14px;color:var(--muted)}
.modes a:hover{color:var(--text);text-decoration:none}
.modes a.on{background:var(--accent);color:#07260f;font-weight:600}
.edit-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start;margin-top:26px}
.edit-side{position:sticky;top:74px}
.btn.sm{padding:5px 11px;font-size:13px}
.document{max-height:64vh;overflow-y:auto;line-height:1.9;font-size:15px;padding:18px 20px;user-select:none}
.document::-webkit-scrollbar{width:8px}
.document::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.para{margin:0 0 16px;position:relative;padding-left:58px}
.ptime{position:absolute;left:0;top:4px;color:var(--muted);font-size:11px}
.w{border-radius:3px;padding:1px 1px;cursor:pointer}
.w:hover{background:var(--panel-2)}
.w.sel{background:var(--accent-dim);color:#eafff2}
.w.cut{color:#6b7280;text-decoration:line-through;text-decoration-color:var(--danger);text-decoration-thickness:2px}
.w.cut:hover{color:#9aa3b2}
.w.playing{box-shadow:inset 0 -2px 0 var(--accent)}
.figures{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.fig{display:block;font-size:20px;font-weight:700;letter-spacing:-.4px}
.figlab{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.checkline{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;font-size:13px;color:var(--text);cursor:pointer}
.checkline input{margin-top:2px;flex:none;width:15px;height:15px;accent-color:var(--accent)}
.checkline .muted{font-size:12px}
@media(max-width:960px){.split{grid-template-columns:1fr}.edit-layout{grid-template-columns:1fr}.edit-side{position:static}}
@media(max-width:640px){.hide-sm{display:none}main{padding:18px 14px 60px}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/">clip<span>story</span></a>
  {% if user %}<nav>
    <a href="/">Jobs</a>
    <a href="/jobs/new">New job</a>
    {% if user.is_admin %}<a href="/admin">Team</a>{% endif %}
    <span class="who hide-sm">{{ user.email }}</span>
    <form method="post" action="/logout" style="margin:0">
      <button class="btn secondary" style="padding:6px 12px">Sign out</button>
    </form>
  </nav>{% endif %}
</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
